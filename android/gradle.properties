# 只放项目级构建配置。JDK 走全局 ~/.gradle/gradle.properties 里的
# org.gradle.java.home=JDK21——Gradle 8.x 不认系统默认的 JDK25，别在这里改回去。
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin 默认会另起一个 KotlinCompileDaemon 进程做编译，后台就长期挂两个 JVM，
# 而 CPU 尖峰恰恰来自那一个。改成 in-process：编译在 Gradle 自己的 daemon 里跑，
# 只留一个 JVM——代价是这个 daemon 的堆要够（见上面 -Xmx2g）。
kotlin.compiler.execution.strategy=in-process
# 这个 daemon 默认不死：实测闲置时 Footprint 983 MB、连着跑几轮构建能涨到 1334 MB，
# 堆里的编译器对象不会还给系统。给它 10 分钟空闲上限——连着改代码时不碍事，
# 停下来之后它自己退出，后台不会留一个我们占着的进程。
org.gradle.daemon.idletimeout=600000
